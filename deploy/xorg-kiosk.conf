# Kiosk: no VT switching (Ctrl+Alt+Fn) and no Ctrl+Alt+Backspace server kill
Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap" "true"
EndSection

# The monitor reports no EDID, so Xorg would pick 1024x768. The 1920x1080 mode is added by the kernel
# command line (video=HDMI-A-1:1920x1080@60 in /boot/firmware/cmdline.txt).
Section "Monitor"
    Identifier "HDMI-1"
    Option "PreferredMode" "1920x1080"
EndSection
